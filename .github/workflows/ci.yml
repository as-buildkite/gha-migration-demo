name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Job-level env vars are set per-job below; this is a workflow-level default.
env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    env:
      # Job-level env var.
      RUFF_OUTPUT_FORMAT: github
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: ESLint
        run: npm run lint

  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    env:
      # Job-level env var consumed by the app during tests.
      APP_ENV: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest --junitxml=reports/pytest-junit.xml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Run jest
        run: npm test

      - name: Smoke test against external API
        # Reference a repo secret (do not need to create it for this demo).
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "${API_KEY}" ]; then
            echo "API_KEY not set — skipping authenticated smoke test"
          else
            echo "Running smoke test with provided API key"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}-${{ matrix.os }}
          path: reports/
          if-no-files-found: ignore

  docker:
    name: Build & push image
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
