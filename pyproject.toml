[project]
name = "gha-migration-demo"
version = "0.1.0"
description = "Sample Python + Node app for demoing the Buildkite GitHub Actions migration converter"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
